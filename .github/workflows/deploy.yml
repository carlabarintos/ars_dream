name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: arsdream-1f00f

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_FIREBASE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_USE_FIREBASE_EMULATORS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy_hosting:
    needs: build
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

  deploy_backend:
    needs: build
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Keeps Secret Manager's RESEND_API_KEY in sync with the GitHub secret of the same
      # name on every deploy. --data-file - reads the value from stdin (non-interactive);
      # --force skips the "grant access to this secret?" prompt and repoints any function
      # already using it at the new version automatically.
      - run: echo -n "${{ secrets.RESEND_API_KEY }}" | npx firebase functions:secrets:set RESEND_API_KEY --project ${{ env.FIREBASE_PROJECT_ID }} --data-file - --force --non-interactive
      # SENTRY_DSN is intentionally NOT a Secret Manager secret (unlike RESEND_API_KEY above) —
      # DSNs are meant to be public, so it's a plain env var from functions/.env.<project-id>
      # (see functions/src/sentry.ts). That also means it stays truly optional: no GitHub
      # secret or Secret Manager entry has to exist for functions to deploy successfully.
      # functions/ is built automatically by firebase.json's predeploy hooks
      #
      # NOTE: --only lists every function EXCEPT scheduledFirestoreBackup on purpose. A plain
      # `--only functions` deploys the full set AND deletes any deployed function no longer in
      # the codebase's export list — but this deploy's service account lacks the
      # cloudscheduler.jobs.update/delete IAM permissions Cloud Scheduler-backed (onSchedule)
      # functions need, so touching scheduledFirestoreBackup at all (update OR delete) 403s and
      # fails the whole deploy. Scoping to an explicit function list here means firebase-tools
      # never tries to reconcile that one function, so it's left alone (inert, but harmless)
      # until the account is granted roles/cloudscheduler.admin on arsdream-1f00f. Once granted,
      # drop this back to the plain `functions` target to pick scheduledFirestoreBackup back up.
      - run: npx firebase deploy --only functions:acceptRegistration,functions:confirmPayment,functions:cancelRegistration,functions:reopenMarathon,functions:clearOperationalData,functions:onRegistrationStatusChange,functions:onRegistrationQueueChange,functions:onRegistrationCreated,functions:onNewPersonalMessage,functions:onAnnouncementCreated,functions:flagOverdueRegistrations,firestore:rules,firestore:indexes,storage --project ${{ env.FIREBASE_PROJECT_ID }} --non-interactive --force
